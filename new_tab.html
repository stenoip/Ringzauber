<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stenoip New Tab</title>
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0808da 0%, #4897e6 100%);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.6;
            transition: background-image 0.5s ease-in-out;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            z-index: 1;
        }

        .clock {
            font-size: 5rem;
            font-weight: 200;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .date {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .praterich-input {
            background: linear-gradient(90deg, #2b0c4b 0%, #1a1a2e 100%);
            border: 1px solid #a64bf4;
            color: white;
            text-align: center;
        }

        .bookmarks {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
            list-style: none;
            padding: 0;
        }

        .bookmark-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(5px);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        #bg-upload { display: none; }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div class="container">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">Loading Date...</div>

        <div class="input-wrapper">
            <form action="https://stenoip.github.io/oodles/search" method="get">
                <input type="text" name="q" class="search-input" placeholder="Search the web..." autocomplete="off">
            </form>

            <input type="text" id="praterich-input" class="praterich-input" placeholder=" Ask Praterich (Send to Sidebar)...">
        </div>

        <ul class="bookmarks" id="bookmarks-list"></ul>
    </div>

    <div class="footer">
        <button class="icon-btn" onclick="document.getElementById('bg-upload').click()" title="Change Background">🖼️</button>
        <input type="file" id="bg-upload" accept="image/*">
        <button class="icon-btn" onclick="resetBackground()" title="Reset Background">↺</button>
    </div>

    <script>
        /* OMITTED: QWebChannel and Qt transport logic.
           REASON: This block contains proprietary communication protocols for the Stenoip browser engine.
        */
        console.info("Stenoip Engine: Core communication protocols are hidden for security purposes.");
    </script>

    <script>
        // --- UI Logic Only ---
        
        window.onload = function() {
            /* OMITTED: Python/Qt Backend Bridge initialization.
               REASON: Proprietary backend integration logic removed.
            */
            loadBackground();
            loadBookmarks();
        };

        // UI Handlers
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString('en-GB', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Background Logic
        const bgLayer = document.getElementById('bg-layer');
        const bgUpload = document.getElementById('bg-upload');
        const STORAGE_KEY = 'stenoip_bg_pref';

        function loadBackground() {
            const storedBg = localStorage.getItem(STORAGE_KEY);
            if (storedBg) {
                bgLayer.style.backgroundImage = `url(${storedBg})`;
                bgLayer.style.backgroundColor = "rgba(0,0,0,0.4)"; 
                bgLayer.style.backgroundBlendMode = "darken";
            }
        }

        bgUpload.addEventListener('change', function() {
            const file = this.files[0];
            if (file && file.size <= 2 * 1024 * 1024) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem(STORAGE_KEY, e.target.result);
                    bgLayer.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        });

        function resetBackground() {
            localStorage.removeItem(STORAGE_KEY);
            bgLayer.style.backgroundImage = 'none';
        }

        // Bookmark Logic
        function loadBookmarks() {
            const list = document.getElementById('bookmarks-list');
            const defaultBookmarks = [
                { name: "YouTube", url: "https://youtube.com" },
                { name: "GitHub", url: "https://github.com" },
                { name: "Reddit", url: "https://reddit.com" }
            ];
            list.innerHTML = defaultBookmarks.map(bm => `
                <li>
                    <a href="${bm.url}" class="bookmark-item">
                        <img src="https://www.google.com/s2/favicons?q=${bm.url}" class="bookmark-icon">
                        ${bm.name}
                    </a>
                </li>
            `).join('');
        }
    </script>
</body>
</html>
